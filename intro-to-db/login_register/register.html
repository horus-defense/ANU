<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="./node_modules/boxicons/css/boxicons.min.css">
    <title>Register</title>
</head>
<body>
    <style>
        form {
            height: 500px;
        }
    </style>
    <nav>
        <div class="">
            <a href="index.html">Login</a>
        </div>
        <div class="">
            <a href="register.html">Register</a>
        </div>
    </nav>
    <br>
    <header>
        <img src="assets/logo.png" alt="ANU LOGO" width="150px">
        <span id="header-text">Intro to Database Systems</span>
    </header>
    <br>
    <div class="container">
        <form action="register.php" method="post" id="registerForm">
            <span class="form-title">SIGN UP</span>
            <div class="login-form">
                <div class="input-group">
                    <div class="icons">
                        <i class='bx bx-user' ></i>
                    </div>
                    <input type="text" id="username" name="username" placeholder="Username" required>
                </div>
                <div class="input-group">
                    <div class="icons">
                        <i class='bx bx-envelope' ></i>
                    </div>
                    <input type="email" id="email" name="regEmail" placeholder="Email" required>
                </div>
                
                <div class="input-group">
                    <div class="icons">
                        <i class='bx bx-lock-alt' ></i>
                    </div>
                    <input type="password" id="password" name="password" placeholder="Password" required>
                    <i class='bx bx-show toggle-password' onclick="togglePassword('password', this)"></i>
                        
                </div>
                <div class="input-group">
                    <div class="icons">
                        <i class='bx bx-lock-alt' ></i>
                    </div>
                    <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm Password" required>
                    <i class='bx bx-show toggle-password' onclick="togglePassword('confirm_password', this)"></i>
        
                </div>
                <div id="message"></div>
                <input class="submit-btn" type="submit" value="SIGN UP">
                <div class="register-link"> 
                    <p>Already have an account? <a href="index.html">Sign in here</a></p>
                </div>
            </div>
            
        </form>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
